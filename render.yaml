# Blueprint do Render. Ao criar o serviço a partir do repositório,
# ele lê este arquivo e configura tudo sozinho.
services:
  - type: web
    name: portfolio-thiago
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Portfolio Thiago"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true          # o Render gera e guarda
      - key: APP_URL
        sync: false                  # preencha com a URL do serviço
      - key: LOG_CHANNEL
        value: stderr                # logs aparecem no painel do Render
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: ADMIN_EMAIL
        sync: false                  # seu e-mail de acesso ao painel
      - key: ADMIN_PASSWORD
        sync: false                  # sua senha (mínimo 8 caracteres)
      - key: ADMIN_NOME
        value: Thiago

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio
